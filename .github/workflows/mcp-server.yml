name: MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-server.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'package.json'
      - '.github/workflows/mcp-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
