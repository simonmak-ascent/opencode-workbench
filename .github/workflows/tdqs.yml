name: MCP Tool Definition Quality

on:
  pull_request:
    paths:
      - "mcp-server/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  tdqs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build the MCP server
        run: pnpm build

      # Deterministic stages only (context signals, hard gates, shadow prefilter).
      # The model-graded `score` runs on Glama's sweep and needs an API key.
      - name: Lint the MCP tool surface (Glama TDQS)
        run: npx --yes mcp-tdqs@0.2.0 lint --command "node mcp-server/dist/index.js" --fail-on error
