name: Validate Inventory

on:
  # `validate-config` is a required status check: run it on every PR so unrelated
  # changes are not left permanently "expected", and so a PR that only edits a file
  # an assertion reads (README/package.json/connector.json) cannot skip it.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'opencode.json'
      - 'connector.json'
      - 'package.json'
      - 'server.json'
      - 'README.md'
      - '.devcontainer/**'
      - 'scripts/**'

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate opencode.json schema
        run: |
          if [ -f opencode.json ]; then
            python3 -c "import json; json.load(open('opencode.json'))" && echo "opencode.json: Valid JSON" || { echo "ERROR: Invalid JSON"; exit 1; }
          fi

      - name: Validate devcontainer.json schema
        run: |
          if [ -f .devcontainer/devcontainer.json ]; then
            python3 -c "import json; json.load(open('.devcontainer/devcontainer.json'))" && echo "devcontainer.json: Valid JSON" || { echo "ERROR: Invalid JSON"; exit 1; }
          fi

      - name: Check MCP server count
        run: |
          python3 << 'PYEOF'
          import json
          with open('opencode.json') as f:
              config = json.load(f)
          mcp = config.get('mcp', {})
          enabled = [k for k, v in mcp.items() if v.get('enabled', False)]
          print(f"Enabled MCP servers: {len(enabled)}")
          for s in enabled:
              print(f"  MCP: {s}")
          PYEOF

      - name: Assert docs match opencode.json MCP count
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          with open('opencode.json') as f:
              mcp = json.load(f).get('mcp', {})
          total = len(mcp)
          enabled = sum(1 for v in mcp.values() if v.get('enabled', True))
          # AGENTS.md is gitignored (a local-only artifact), so it is absent from a
          # CI checkout. Assert it only when present — never crash on its absence.
          checks = [('README.md', f'{total} configured'), ('AGENTS.md', f'{total} MCP servers')]
          fails, skipped = [], []
          for path, needle in checks:
              if not os.path.exists(path):
                  skipped.append(f'{path}: not in checkout (gitignored) — skipped')
                  continue
              if needle not in open(path).read():
                  fails.append(f'{path}: missing "{needle}"')
          for line in skipped:
              print(line)
          if fails:
              print('DRIFT: documented MCP count does not match opencode.json')
              for f in fails:
                  print('  -', f)
              print(f'  actual: {total} configured, {enabled} enabled')
              sys.exit(1)
          print(f'Docs match config: {total} configured, {enabled} enabled')
          PYEOF

      - name: Assert server.json matches package.json
        run: |
          python3 << 'PYEOF'
          import json, sys
          pkg = json.load(open('package.json'))
          srv = json.load(open('server.json'))
          vp, vs = pkg.get('version'), srv.get('version')
          ident = (srv.get('packages') or [{}])[0].get('identifier')
          print(f"package.json: {pkg.get('name')}@{vp}; server.json: {ident}@{vs}")
          if vs != vp or ident != pkg.get('name'):
              print('DRIFT: server.json must match package.json name/version')
              sys.exit(1)
          PYEOF

      - name: Assert connector.json matches package.json version
        run: |
          python3 << 'PYEOF'
          import json, sys
          pkg = json.load(open('package.json'))
          con = json.load(open('connector.json'))
          vp, vc = pkg.get('version'), con.get('version')
          print(f"package.json: {vp}; connector.json: {vc}")
          if vc != vp:
              print('DRIFT: connector.json version must match package.json')
              print('  connector.json ships in the npm tarball and the Docker image,')
              print('  so a mismatch is shipped, not just documented.')
              sys.exit(1)
          for key in ('name', 'title', 'description', 'transport'):
              if not con.get(key):
                  print(f'DRIFT: connector.json is missing required key "{key}"')
                  sys.exit(1)
          PYEOF

      - name: Check skills count
        run: |
          count=$(find .opencode/skills -name "SKILL.md" 2>/dev/null | wc -l)
          echo "Skills: $count"
          if [ "$count" -lt 20 ]; then
            echo "WARNING: Less than 20 skills detected"
          fi

      - name: Validate shell scripts syntax
        run: |
          for script in scripts/**/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" && echo "OK: $script" || { echo "ERROR: $script has syntax errors"; exit 1; }
            fi
          done
